# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# Package ecosystems (CMake) are added when the first project's manifests exist.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    # The release line (C++20 (GCC 16 in the container)) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # Hook revisions in .pre-commit-config.yaml (enforced by the pre-commit CI job).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: ci
    # Hooks pinned to a project toolchain's version change together with that toolchain.
    ignore:
      - dependency-name: "https://github.com/pre-commit/mirrors-clang-format"
